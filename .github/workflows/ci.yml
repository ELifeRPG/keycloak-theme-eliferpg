name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Verify Maven/Java are available (used internally by keycloakify build)
        run: |
          mvn -version
          java -version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check brand token contrast
        run: npm run check:contrast

      - name: Build theme jar
        run: npm run build-keycloak-theme
